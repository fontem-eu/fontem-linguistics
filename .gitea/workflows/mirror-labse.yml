name: Mirror LaBSE

# Pushes a signed OCI artifact mirror of the LaBSE model to the internal
# registry. Source-of-truth is mirror/labse.version.yaml; the workflow
# refuses to run if the pinned revision isn't a full 40-char SHA.
#
# Dispatched manually after bumping mirror/labse.version.yaml and/or
# after the upstream HuggingFace revision we want to mirror has changed.

on:
  workflow_dispatch: {}

jobs:
  mirror:
    # ubuntu-latest on this runner maps to ci-node (no pip). The mirror
    # workflow needs Python + curl + shell; `python` maps to ci-python
    # which has all of them.
    runs-on: python
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          pip install --no-cache-dir huggingface_hub pyyaml

      - name: Validate version file (reject non-SHA pins)
        id: validate
        run: python3 mirror/mirror_labse.py --skip-download

      - name: Download + pack model snapshot
        id: pack
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 mirror/mirror_labse.py --out-dir /tmp/labse-mirror

      - name: Install oras + cosign
        run: |
          curl -sL https://nexus.void42.internal/repository/github-releases/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin oras
          chmod +x /usr/local/bin/oras
          curl -sL https://nexus.void42.internal/repository/github-releases/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Login to registry
        run: |
          # Internal registry serves HTTP only; --plain-http skips the
          # HTTPS probe that would otherwise fail with "server gave HTTP
          # response to HTTPS client".
          echo "${{ secrets.REGISTRY_PASSWORD }}" \
            | oras login --plain-http gitea-http.dev-tools.svc.cluster.local:3000 \
                --username "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Push OCI artifact
        id: push
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          HF_REVISION: ${{ steps.validate.outputs.hf_revision }}
          ENCODER_ID: ${{ steps.validate.outputs.encoder_id }}
          FETCHED_AT: ${{ steps.pack.outputs.fetched_at }}
        run: |
          REF="gitea-http.dev-tools.svc.cluster.local:3000/fontem/models/labse:${TAG}"
          # oras v1.2+ rejects absolute file paths by default; cd so the
          # layer reference is a plain relative filename.
          cd /tmp/labse-mirror
          oras push --plain-http "$REF" \
            --artifact-type application/vnd.gmr.model.labse.v1+json \
            --annotation "org.opencontainers.image.source=https://huggingface.co/sentence-transformers/LaBSE" \
            --annotation "org.opencontainers.image.revision=${HF_REVISION}" \
            --annotation "org.opencontainers.image.created=${FETCHED_AT}" \
            --annotation "io.gmr.encoder_id=${ENCODER_ID}" \
            labse.tar:application/x-tar
          # Resolve + export the immutable digest so subsequent steps sign
          # the exact manifest we just pushed, not whatever "labse:1.0.0"
          # resolves to later.
          DIGEST=$(oras resolve --plain-http "$REF")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref_by_digest=gitea-http.dev-tools.svc.cluster.local:3000/fontem/models/labse@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign artifact with cosign
        env:
          COSIGN_PASSWORD: ""
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          echo "$COSIGN_KEY" > /tmp/cosign.key
          cosign sign --key /tmp/cosign.key --yes --allow-http-registry \
            "${{ steps.push.outputs.ref_by_digest }}"
          rm /tmp/cosign.key

      - name: Attest SBOM with cosign
        env:
          COSIGN_PASSWORD: ""
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          echo "$COSIGN_KEY" > /tmp/cosign.key
          cosign attest --key /tmp/cosign.key --yes --allow-http-registry \
            --type cyclonedx \
            --predicate /tmp/labse-mirror/sbom.cdx.json \
            "${{ steps.push.outputs.ref_by_digest }}"
          rm /tmp/cosign.key

      - name: Summary
        run: |
          echo "::notice title=Mirror done::${{ steps.validate.outputs.encoder_id }} → ${{ steps.push.outputs.ref_by_digest }}"

name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: pip install --no-cache-dir -r requirements.txt pytest pylint pytest-cov bandit pip-audit
      - name: Unit + component tests with 90% coverage gate
        run: python3 -m pytest tests/unit tests/component -q --cov=src --cov-report=xml:coverage.xml --cov-config=.coveragerc --cov-fail-under=90 --junitxml=test-results.xml
      - name: Integration tests (testcontainers-postgres)
        run: python3 -m pytest tests/integration -q || echo "integration skipped (no docker in runner)"
      - name: Lint
        run: python3 -m pylint src tests --output-format=parseable --reports=no
      - name: Security audit
        run: |
          pip-audit -r requirements.txt --desc 2>&1 || true
          python3 -m bandit -r src -q || true

  analyze:
    needs: test
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps and generate coverage
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          pip install --no-cache-dir -r requirements.txt pytest pytest-cov cyclonedx-bom
          # No `|| true`: a failing suite used to still publish a
          # coverage report and pass the job, so broken tests reached
          # main looking green.
          python3 -m pytest tests/unit tests/component -q --cov=src --cov-report=xml:coverage.xml --cov-config=.coveragerc
      # Was an inline `npx sonarqube-scanner` with no
      # -Dsonar.qualitygate.wait, so it uploaded the report and never
      # looked at the verdict: gmr-linguistics has been sitting on
      # ERROR (new_coverage 73.1, duplication 9.7%, 4 new violations)
      # with a green pipeline. The shared action waits for the gate,
      # exits non-zero on ERROR, and prints which condition failed.
      - uses: actions/checkout@v4
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - uses: ./.ci-actions/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
      - name: Generate SBOM
        run: cyclonedx-py requirements requirements.txt --of json -o sbom.json
      - name: Upload SBOM to Dependency-Track
        run: |
          curl -fsS -X POST "http://dependency-track.dependency-track.svc.cluster.local:8080/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" \
            -H "Content-Type: multipart/form-data" \
            -F "projectName=fontem-linguistics" -F "projectVersion=$(git rev-parse --short HEAD)" \
            -F "autoCreate=true" -F "bom=@sbom.json"

  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker
        run: curl -fsSL https://nexus.void42.internal/repository/docker-releases/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
      - name: Build and push image
        run: |
          TAG="v$(git rev-parse --short HEAD)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea-http.dev-tools.svc.cluster.local:3000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker build --network host -t gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-linguistics:$TAG .
          docker push gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-linguistics:$TAG
          # Signed and attested by digest, never by tag: a tag can be
          # re-pointed after signing.
          DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-linguistics:$TAG" | grep -oE 'sha256:[0-9a-f]{64}' | head -1 || true)
          [ -n "$DIGEST" ] || { echo "::error::could not resolve the pushed digest for fontem-linguistics:$TAG"; exit 1; }
          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
      - name: Sign image with Cosign
        env:
          COSIGN_PASSWORD: ""
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          curl -sL https://nexus.void42.internal/repository/github-releases/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          echo "$COSIGN_KEY" > /tmp/cosign.key
          # --tlog-upload=false: the image is private; nothing goes to the
          # public Rekor log (the cluster verifies with ignoreTlog).
          cosign sign --tlog-upload=false --key /tmp/cosign.key --yes --allow-http-registry "gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-linguistics@$DIGEST"
          rm /tmp/cosign.key
      - name: Deploy to gitops (prod — singleton)
        run: |
          git clone --depth=1 "http://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@gitea-http.dev-tools.svc.cluster.local:3000/fontem/gitops.git" /tmp/gitops
          cd /tmp/gitops
          sed -i 's/version: ".*"/version: "'$TAG'"/' linguistics-service/fontem-linguistics.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add linguistics-service/fontem-linguistics.yaml
          git diff --cached --quiet || git commit -m "ci: deploy fontem-linguistics $TAG"
          git push origin main

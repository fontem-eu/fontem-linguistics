version: "dev"
databaseUrl: "postgresql+asyncpg://linguistics:$(POSTGRES_PASSWORD)@postgresql:5432/linguistics"
mistralApiUrl: "https://api.mistral.ai/v1"
mistralChatModel: "mistral-medium-latest"
mistralEmbedModel: "mistral-embed"
spendCapUsdDaily: "50.0"
breakerFailureThreshold: "0.05"
breakerWindowS: "60"
breakerCooldownS: "30"
breakerMinRequests: "20"
nllbModel: "facebook/nllb-200-distilled-600M"
labseModel: "sentence-transformers/LaBSE"
localModelsPath: "/models"
inprocessLruSize: "4096"
modelsVolumeSize: "10Gi"
replicas: 1
resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  # Peak during first cold load + quantise runs ~6-9 GB on NLLB-600M
  # (fp32 weights from `from_pretrained` + quantize_dynamic scratch
  # held briefly before GC finalises). 12 Gi gives ~30% headroom on
  # observed peak. Steady-state after both models are quantised is
  # ~2 GB resident, so the 1 Gi request keeps the scheduler honest.
  limits:
    memory: "12Gi"
    cpu: "2"

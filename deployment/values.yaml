version: "dev"
databaseUrl: "postgresql+asyncpg://linguistics:$(POSTGRES_PASSWORD)@postgresql:5432/linguistics"
mistralApiUrl: "https://api.mistral.ai/v1"
mistralChatModel: "mistral-medium-latest"
mistralEmbedModel: "mistral-embed"
spendCapUsdDaily: "50.0"
breakerFailureThreshold: "0.05"
breakerWindowS: "60"
breakerCooldownS: "30"
breakerMinRequests: "20"
nllbModel: "facebook/nllb-200-distilled-600M"
labseModel: "sentence-transformers/LaBSE"
localModelsPath: "/models"
inprocessLruSize: "4096"
modelsVolumeSize: "10Gi"
replicas: 1
resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  # Peak during first cold load (fp32 weights downloaded + int8 copy
  # held briefly before GC) reaches ~5 GB on NLLB-600M and spikes again
  # when LaBSE loads next. 6 Gi was hitting OOMKilled; 8 Gi leaves
  # enough headroom during the load window. Steady-state after both
  # models are quantised is ~2 GB so the request stays low.
  limits:
    memory: "8Gi"
    cpu: "2"

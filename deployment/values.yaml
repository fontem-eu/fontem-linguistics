version: "dev"
databaseUrl: "postgresql+asyncpg://linguistics:$(POSTGRES_PASSWORD)@postgresql:5432/linguistics"
mistralApiUrl: "https://api.mistral.ai/v1"
mistralChatModel: "mistral-medium-latest"
mistralEmbedModel: "mistral-embed"
spendCapUsdDaily: "50.0"
breakerFailureThreshold: "0.05"
breakerWindowS: "60"
breakerCooldownS: "30"
breakerMinRequests: "20"
nllbModel: "facebook/nllb-200-distilled-600M"
labseModel: "sentence-transformers/LaBSE"
localModelsPath: "/models"
inprocessLruSize: "4096"
modelsVolumeSize: "10Gi"
replicas: 1
resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  # Fp32 steady-state with both models loaded is ~2.5 GB resident
  # (NLLB ~0.84 GB + LaBSE ~0.7 GB + Python/FastAPI baseline ~0.7 GB +
  # activations). 6 Gi gives >2x headroom for any inference spikes.
  # Quantisation was a dead-end on this torch (see config comment).
  limits:
    memory: "6Gi"
    cpu: "2"

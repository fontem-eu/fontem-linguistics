version: "dev"
databaseUrl: "postgresql+asyncpg://linguistics:$(POSTGRES_PASSWORD)@postgresql:5432/linguistics"
mistralApiUrl: "https://api.mistral.ai/v1"
mistralChatModel: "mistral-medium-latest"
# Pinned to the versioned tag. 'mistral-embed' is a moving alias that
# Mistral resolves server-side; pinning to the dated ID means our
# encoder_id (mistral-embed@api-mistral-embed-2312) reflects the actual
# model bits and a silent upstream bump can't corrupt embedding
# comparisons in place. Verified on 2026-07-16: 'mistral-embed' aliases
# to 'mistral-embed-2312' with identical output.
# Bump procedure: check https://api.mistral.ai/v1/models, pick the new
# versioned id, update here, plan a re-embed pass because encoder_id
# changes → old vectors are no longer comparable to new ones.
mistralEmbedModel: "mistral-embed-2312"
spendCapUsdDaily: "50.0"
breakerFailureThreshold: "0.05"
breakerWindowS: "60"
breakerCooldownS: "30"
breakerMinRequests: "20"
nllbModel: "facebook/nllb-200-distilled-600M"
labseModel: "sentence-transformers/LaBSE"
localModelsPath: "/models"
# LaBSE signed-mirror. Tag + encoder-id MUST match the artifact that the
# mirror-labse workflow pushed to the registry. Bump together after
# running the workflow with a new mirror_version or hf_revision.
labseMirrorVersion: "1.0.0"
labseEncoderId: "labse@1.0.0-836121a"

# MiniLM signed-mirror — paraphrase-multilingual-MiniLM-L12-v2 pinned
# to HF revision e8f8c211... (lastModified 2026-01-28, verified 2026-07-16).
# Same rules as labseMirrorVersion: bump together with mirror workflow.
minilmModel: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
minilmMirrorVersion: "1.0.0"
minilmEncoderId: "minilm@1.0.0-e8f8c21"
# Registry reference for the mirrored artifact. Uses the HTTPS / ingress
# hostname (contribute.void42.internal) so the initContainer authenticates
# with the same dockerconfigjson that kubelet uses for imagePullSecrets.
# The internal DNS alias (gitea-http.dev-tools.svc.cluster.local:3000)
# keys credentials under a different host entry and would miss the auth.
labseMirrorRef: "contribute.void42.internal/golden/models/labse"
inprocessLruSize: "4096"
replicas: 1
resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  # Fp32 steady-state with both models loaded is ~2.5 GB resident
  # (NLLB ~0.84 GB + LaBSE ~0.7 GB + Python/FastAPI baseline ~0.7 GB +
  # activations). 6 Gi gives >2x headroom for any inference spikes.
  # Quantisation was a dead-end on this torch (see config comment).
  limits:
    memory: "6Gi"
    cpu: "2"

# Scheduling. The prod instance pins to the production node (which is
# tainted); the dev instance leaves both empty and floats on the
# development nodes.
nodeSelector: {}
tolerations: []

modelsVolumeSize: "10Gi"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fontem-linguistics
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fontem-linguistics
  template:
    metadata:
      labels:
        app: fontem-linguistics
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        - name: regcred
      volumes:
        # Models materialised at pod start by the fetch-models initContainer.
        # emptyDir is per-pod so we can horizontally scale (no RWO PVC lock);
        # cost is ~60-90s cold-start per pod paying the model download once.
        - name: models
          emptyDir:
            sizeLimit: {{ .Values.modelsVolumeSize | default "10Gi" }}
      initContainers:
        - name: fetch-models
          image: contribute.void42.internal/void42/ci-python:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              pip install --quiet --no-cache-dir huggingface_hub
              python - <<'PY'
              import os
              from huggingface_hub import snapshot_download
              targets = [
                  (os.environ["LABSE_REPO"], os.environ["LABSE_REV"],
                   os.environ["LABSE_MODEL_PATH"]),
                  (os.environ["MINILM_REPO"], os.environ["MINILM_REV"],
                   os.environ["MINILM_MODEL_PATH"]),
              ]
              for repo, rev, dest in targets:
                  # Skip if the dir already exists AND has the sentinel config
                  # file — makes pod restarts on an emptyDir a no-op the second
                  # time (relevant only if the pod restarts without reschedule).
                  if os.path.isfile(os.path.join(dest, "config.json")):
                      print(f"[fetch] {repo}@{rev[:7]} already present at {dest}")
                      continue
                  print(f"[fetch] {repo}@{rev[:7]} -> {dest}")
                  snapshot_download(
                      repo_id=repo,
                      revision=rev,
                      local_dir=dest,
                      allow_patterns=[
                          "config.json", "tokenizer*", "special_tokens_map*",
                          "sentence_bert_config.json", "modules.json",
                          "1_Pooling/*", "2_Normalize/*",
                          "*.safetensors", "*.bin",
                      ],
                  )
              print("[fetch] done")
              PY
          env:
            - name: LABSE_REPO
              value: {{ .Values.labseHfRepo | default "sentence-transformers/LaBSE" | quote }}
            - name: LABSE_REV
              value: {{ .Values.labseHfRevision | default "836121a0533e5664b21c7aacc5d22951f2b8b25b" | quote }}
            - name: LABSE_MODEL_PATH
              value: "{{ .Values.localModelsPath }}/labse-{{ .Values.labseMirrorVersion }}"
            - name: MINILM_REPO
              value: {{ .Values.minilmHfRepo | default "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2" | quote }}
            - name: MINILM_REV
              value: {{ .Values.minilmHfRevision | default "e8f8c211226b894fcb81acc59f3b34ba3efd5f42" | quote }}
            - name: MINILM_MODEL_PATH
              value: "{{ .Values.localModelsPath }}/minilm-{{ .Values.minilmMirrorVersion }}"
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "2Gi" }
          volumeMounts:
            - name: models
              mountPath: {{ .Values.localModelsPath | quote }}
      containers:
        - name: api
          image: contribute.void42.internal/golden/fontem-linguistics:{{ .Values.version }}
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fontem-linguistics-pg-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fontem-linguistics-mistral-credentials
                  key: api-key
            # Nebius: translation only. `optional` so the service starts and
            # keeps serving Mistral, NLLB and LaBSE before the secret exists —
            # without a key the Nebius backend is simply not built, and asking
            # for it returns a clear "not configured" rather than a crash loop.
            - name: NEBIUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nebiusSecretName | quote }}
                  key: NEBIUS_API_KEY
                  optional: true
            - name: NEBIUS_API_URL
              value: {{ .Values.nebiusApiUrl | quote }}
            - name: NEBIUS_CHAT_MODEL
              value: {{ .Values.nebiusChatModel | quote }}
            - name: NEBIUS_SPEND_CAP_USD_DAILY
              value: {{ .Values.nebiusSpendCapUsdDaily | quote }}
            # HuggingFace Hub token — lifts the anonymous rate limit
            # for NLLB + LaBSE model downloads on first use of the
            # nllb-local / labse-local backends. Without this, a cold
            # pod serves the first local-model request over ~20-40
            # minutes (seen in prod); with it, ~1-3 minutes.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fontem-linguistics-huggingface-credentials
                  key: token
                  optional: true
            - name: MISTRAL_API_URL
              value: {{ .Values.mistralApiUrl | quote }}
            - name: MISTRAL_CHAT_MODEL
              value: {{ .Values.mistralChatModel | quote }}
            - name: MISTRAL_EMBED_MODEL
              value: {{ .Values.mistralEmbedModel | quote }}
            - name: SPEND_CAP_USD_DAILY
              value: {{ .Values.spendCapUsdDaily | quote }}
            - name: BREAKER_FAILURE_THRESHOLD
              value: {{ .Values.breakerFailureThreshold | quote }}
            - name: BREAKER_WINDOW_S
              value: {{ .Values.breakerWindowS | quote }}
            - name: BREAKER_COOLDOWN_S
              value: {{ .Values.breakerCooldownS | quote }}
            - name: BREAKER_MIN_REQUESTS
              value: {{ .Values.breakerMinRequests | quote }}
            - name: NLLB_MODEL
              value: {{ .Values.nllbModel | quote }}
            - name: LABSE_MODEL
              value: {{ .Values.labseModel | quote }}
            # LaBSE path + encoder-id are derived from labseMirrorVersion
            # (see values.yaml). The service reads model bytes from the
            # PVC path and stamps the encoder-id on every /embed reply.
            - name: LABSE_MODEL_PATH
              value: "{{ .Values.localModelsPath }}/labse-{{ .Values.labseMirrorVersion }}"
            - name: LABSE_ENCODER_ID
              value: {{ .Values.labseEncoderId | quote }}
            - name: MINILM_MODEL
              value: {{ .Values.minilmModel | quote }}
            - name: MINILM_MODEL_PATH
              value: "{{ .Values.localModelsPath }}/minilm-{{ .Values.minilmMirrorVersion }}"
            - name: MINILM_ENCODER_ID
              value: {{ .Values.minilmEncoderId | quote }}
            - name: LOCAL_MODELS_PATH
              value: {{ .Values.localModelsPath | quote }}
            - name: INPROCESS_LRU_SIZE
              value: {{ .Values.inprocessLruSize | quote }}
          volumeMounts:
            - name: models
              mountPath: {{ .Values.localModelsPath | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}